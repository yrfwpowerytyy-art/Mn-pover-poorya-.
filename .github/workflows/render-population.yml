name: Render Population Ranking with Remotion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Persian fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Install Remotion browser
        run: npx remotion browser ensure
      - name: Unpack video and sound assets
        run: unzip -o public/population-remotion-assets.zip -d /tmp/population-assets && cp /tmp/population-assets/remotion-assets/public/* public/
      - name: Verify source media
        run: test -f public/population-source.mp4 && test -f public/wind-swoosh.mp3
      - name: Render
        run: npm run render-population
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: population-ranking-remotion
          path: out/population-ranking.mp4
          if-no-files-found: error
          retention-days: 7
