name: Render Population Ranking - Glass UI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core ffmpeg
      - name: Download uploaded raw video
        run: |
          mkdir -p public
          curl -fL --retry 3 \
            "https://github.com/yrfwpowerytyy-art/Mn-pover-poorya-./releases/download/source-video-v1/output_1794805367_u173651.mp4" \
            -o public/population-source-v2.mp4
          test -s public/population-source-v2.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/population-source-v2.mp4
      - name: Create wind and minimal ding effects
        run: |
          ffmpeg -y -f lavfi -i "anoisesrc=color=pink:sample_rate=44100:duration=1.5" \
            -af "lowpass=f=1100,highpass=f=100,volume=0.34,afade=t=in:st=0:d=0.16,afade=t=out:st=0.48:d=0.92" \
            -codec:a libmp3lame -b:a 128k public/wind-swoosh.mp3
          ffmpeg -y -f lavfi -i "sine=frequency=880:sample_rate=44100:duration=0.42" \
            -af "afade=t=in:st=0:d=0.012,afade=t=out:st=0.08:d=0.34,volume=0.34" \
            -codec:a libmp3lame -b:a 96k public/soft-ding.mp3
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Render edited PopulationRanking composition
        run: npm run render-population
      - name: Upload edited MP4
        uses: actions/upload-artifact@v4
        with:
          name: population-ranking-glass-final
          path: out/population-ranking.mp4
          if-no-files-found: error
          retention-days: 7
