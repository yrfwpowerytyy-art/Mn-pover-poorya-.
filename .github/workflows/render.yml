
name: Render Remotion video

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: pooryannn-video
          path: out/cold-earth.mp4
          if-no-files-found: error
          retention-days: 7
